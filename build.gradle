plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
version = mod_version
group = mod_group_id
base.archivesName = mod_archive_name
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
legacyForge {
 enable { forgeVersion = "${project.minecraft_version}-${project.forge_version}"; disableRecompilation = false }
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload



tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { includeEmptyDirs = false; exclude '.cache/**'; from('LICENSE') { into 'META-INF' } }

repositories { maven { url = 'https://maven.blamejared.com/' } }
dependencies {
 implementation 'com.zeromods:zeromods-core-forge-1.20.1:0.1.0'
 jarJar('com.zeromods:zeromods-core-forge-1.20.1') {
    version {
        strictly '[0.1.0,0.2.0)'
        prefer '0.1.0'
    }
}
 compileOnly 'mezz.jei:jei-1.20.1-common-api:15.20.0.129'
}

repositories { maven { url = 'https://maven.theillusivec4.top/' } }
dependencies { compileOnly 'top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api' }

repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies { compileOnly 'dev.emi:emi-forge:1.1.24+1.20.1' }

// Nested mods must use production SRG mappings, not the development classpath.
configurations.jarJar.attributes {
    attribute(net.neoforged.moddevgradle.legacyforge.internal.MinecraftMappings.ATTRIBUTE,
            objects.named(net.neoforged.moddevgradle.legacyforge.internal.MinecraftMappings, 'srg'))
}

// The tuner reads the running version from this manifest entry, on every loader.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Implementation-Title': mod_name, 'Implementation-Version': mod_version])
    }
}

// Remap the movement hook for Forge's production runtime.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin {
    add sourceSets.main, 'fieldemitters.refmap.json'
    config 'fieldemitters.mixins.json'
}
jar { manifest.attributes('MixinConfigs': 'fieldemitters.mixins.json') }

// Optional scripting adapter; neither dependency is bundled with Field Emitters.
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    compileOnly('maven.modrinth:kubejs:hVR2xUSr') { transitive = false }
    compileOnly('maven.modrinth:rhino:uNALdylI') { transitive = false }
}
