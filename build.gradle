plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = mod_group_id
base.archivesName = mod_archive_name
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jarJar.enable()
minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net'; metadataSources { mavenPom(); artifact() } } }
        filter { includeGroup 'org.lwjgl' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload



tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { includeEmptyDirs = false; exclude '.cache/**'; from('LICENSE') { into 'META-INF' } }

repositories {
 maven { url = 'https://maven.blamejared.com/' }
 maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
 implementation 'com.zeromods:zeromods-core-forge-1.21.1:0.1.1'
 compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
}

dependencies {
    jarJar('com.zeromods:zeromods-core-forge-1.21.1:[0.1.1,0.2.0)') {
        jarJar.pin(it, '0.1.1')
        transitive = false
    }
}
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') {
    archiveClassifier = ''
    includeEmptyDirs = false
    exclude '.cache/**'
    from('LICENSE') { into 'META-INF' }
}
tasks.named('build') { dependsOn tasks.named('jarJar') }

// The tuner reads the running version from this manifest entry, on every loader.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Implementation-Title': mod_name, 'Implementation-Version': mod_version])
    }
}

jar { manifest.attributes('MixinConfigs': 'fieldemitters.mixins.json') }
