plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

neoForge {
    version = neo_version

    runs {
        client {
            client()

        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Generated resources (recipes, loot tables, tags) are produced by the data run and committed.
sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    exclude '.cache/**'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Vendor' : mod_authors,
                'Implementation-Version': mod_version
        ])
    }
    from('LICENSE') {
        into 'META-INF'
    }
}

// Shared mod; composite substitution builds the sibling checkout automatically.
dependencies { jarJar(implementation('com.zeromods:zeromods-core-neoforge-1.21.1')) {
    version {
        strictly '[0.1.2,0.2.0)'
        prefer '0.1.2'
    }
} }

repositories { maven { url = 'https://maven.theillusivec4.top/' } }
dependencies { compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api' }

// Optional scripting adapter; neither dependency is bundled with Field Emitters.
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    compileOnly('maven.modrinth:kubejs:THIGFPwf') { transitive = false }
    compileOnly('maven.modrinth:rhino:SqkDvOLG') { transitive = false }
}
