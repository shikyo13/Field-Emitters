plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = mod_group_id
base.archivesName = mod_archive_name
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {}
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
// Forge scans each development mod as one directory.
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
tasks.named('processResources') { dependsOn tasks.named('compileJava') }
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net'; metadataSources { mavenPom(); artifact() } } }
        filter { includeGroup 'org.lwjgl' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload



tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { includeEmptyDirs = false; exclude '.cache/**'; from('LICENSE') { into 'META-INF' } }
if (providers.gradleProperty('extraMods').isPresent()) {
 dependencies { runtimeOnly files(providers.gradleProperty('extraMods').get().split(',')) }
}

// Isolated localhost server validation; normal server launches retain their defaults.
if (providers.gradleProperty('qaPort').isPresent()) { minecraft.runs.server { args '--port', providers.gradleProperty('qaPort').get() } }
