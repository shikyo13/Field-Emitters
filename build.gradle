plugins {
    id 'fabric-loom' version '1.10.5'
}
version = mod_version
group = mod_group_id
base.archivesName = 'field-emitters-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
    include modApi('teamreborn:energy:4.1.0')
    modImplementation 'maven.modrinth:forge-config-api-port:N5qzq0XV'
    // Loom does not put dependency jar-in-jar libraries on the development classpath.
    runtimeOnly 'com.electronwill.night-config:core:3.8.0'
    runtimeOnly 'com.electronwill.night-config:toml:3.8.0'
}
sourceSets.main.resources.srcDir 'src/generated/resources'

loom { runs { client { client() }; server { server(); programArg '--nogui' } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { includeEmptyDirs = false; exclude '.cache/**'; from('LICENSE') { into 'META-INF' } }

repositories {
 maven { url = 'https://maven.blamejared.com/' }
 maven { url = 'https://maven.terraformersmc.com/releases/' }
 maven { url = 'https://maven.ladysnake.org/releases' }
}
dependencies {
 include(modImplementation('com.zeromods:zeromods-core-fabric-1.21.1:0.1.1'))
 modCompileOnly 'mezz.jei:jei-1.21.1-fabric-api:19.21.0.247'
 modCompileOnly 'dev.emi:emi-fabric:1.1.24+1.21.1'
 modCompileOnly 'dev.emi:trinkets:3.10.0'
}

// The tuner reads the running version from this manifest entry, on every loader.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Implementation-Title': mod_name, 'Implementation-Version': mod_version])
    }
}
