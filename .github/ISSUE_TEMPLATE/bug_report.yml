name: Bug report
description: Report a reproducible problem with Field Emitters.
body:
  - type: input
    id: version
    attributes:
      label: Field Emitters version
      description: Shown in the header of the tuner screen. Please update to the latest release before reporting.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Minecraft and loader versions
      placeholder: Minecraft 1.21.1, NeoForge 21.1.206
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Modpack and power source
      description: The pack version and the energy mod feeding the emitters.
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: latest.log
      description: Attach `logs/latest.log` from the client, and from the server if the problem is on a server. Remove tokens, account details and private server addresses.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots
      description: A screenshot of the emitter's Power tab helps.
