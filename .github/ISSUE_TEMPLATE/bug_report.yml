name: Bug report
description: Report a reproducible problem with Field Emitters.
title: ""
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, NeoForge and Field Emitters versions.
      placeholder: Minecraft 1.21.1, NeoForge 21.1.206, Field Emitters 1.0.0
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Modpack and power source
      description: Include the pack version and the energy mod feeding the emitters when relevant.
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: A screenshot of the emitter's Power tab helps. Remove tokens, account details and private server information from logs.
